<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Blueprint Wireframe Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans">

    <!-- Header / Toolbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-3 flex flex-wrap items-center justify-between gap-2">
        <h1 class="text-lg font-bold text-sky-400">3D Wireframe Builder</h1>
        
        <div class="flex items-center gap-2">
            <button id="btnUndo" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-sm">تراجع (Undo)</button>
            <button id="btnClearCanvas" class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-sm">مسح الشاشة</button>
            <button id="btnClearAll" class="bg-rose-600 hover:bg-rose-500 px-3 py-1 rounded text-sm">مسح الكل</button>
            <button id="btnExport" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-1 rounded text-sm font-bold">تصدير OBJ</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Controls -->
        <aside class="w-72 bg-slate-800 border-l border-slate-700 p-4 flex flex-col gap-4 overflow-y-auto">
            
            <!-- Image Controls -->
            <div class="border-b border-slate-700 pb-3">
                <label class="block text-xs font-semibold mb-1 text-slate-400">تحميل الصورة المرجعية:</label>
                <input type="file" id="imgLoader" accept="image/*" class="text-xs text-slate-300 file:bg-sky-600 file:border-0 file:rounded file:px-2 file:py-1 file:text-white cursor-pointer w-full">
            </div>

            <!-- Image Pan/Zoom Settings -->
            <div class="border-b border-slate-700 pb-3 space-y-2">
                <span class="text-xs font-semibold text-slate-400">ضبط وتكبير الصورة:</span>
                <div>
                    <label class="text-xs flex justify-between">التقريب (Zoom): <span id="valZoom">100%</span></label>
                    <input type="range" id="sliderZoom" min="10" max="300" value="100" class="w-full">
                </div>
                <div>
                    <label class="text-xs flex justify-between">إزاحة سينية (Offset X):</label>
                    <input type="range" id="sliderOffsetX" min="-200" max="200" value="0" class="w-full">
                </div>
                <div>
                    <label class="text-xs flex justify-between">إزاحة صادية (Offset Y):</label>
                    <input type="range" id="sliderOffsetY" min="-200" max="200" value="0" class="w-full">
                </div>
            </div>

            <!-- Precision Controls -->
            <div class="space-y-2">
                <span class="text-xs font-semibold text-slate-400">إعدادات النقاط والرسم:</span>
                <div>
                    <label class="text-xs flex justify-between">حجم النقطة (Point Size): <span id="valPointSize">3px</span></label>
                    <input type="range" id="sliderPointSize" min="1" max="20" value="3" class="w-full">
                </div>
                <div>
                    <label class="text-xs flex justify-between">عمق المجسم (Extrude Depth):</label>
                    <input type="range" id="sliderDepth" min="1" max="50" value="10" class="w-full">
                </div>
            </div>

        </aside>

        <!-- Canvases Viewport Area -->
        <main class="flex-1 grid grid-cols-2 gap-2 p-2 bg-slate-950">
            <!-- 2D Drawing Canvas -->
            <div class="relative border border-slate-800 rounded bg-black flex items-center justify-center overflow-hidden">
                <canvas id="drawCanvas" class="absolute inset-0 w-full h-full cursor-crosshair"></canvas>
                <span class="absolute top-2 right-2 bg-slate-900/80 text-xs px-2 py-1 rounded border border-slate-700">شاشة الرسم 2D</span>
            </div>

            <!-- 3D Preview Canvas -->
            <div id="threeContainer" class="relative border border-slate-800 rounded bg-slate-900 overflow-hidden">
                <span class="absolute top-2 right-2 bg-slate-900/80 text-xs px-2 py-1 rounded border border-slate-700 z-10">معاينة 3D</span>
            </div>
        </main>

    </div>

    <!-- Core Scripting -->
    <script>
        // Setup 2D Drawing Canvas & Image Engine
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let bgImg = null;
        let points = [];
        let zoom = 1;
        let offsetX = 0, offsetY = 0;
        let pointSize = 3;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            render2D();
        }
        window.addEventListener('resize', resizeCanvas);

        // Load Blueprint Image
        document.getElementById('imgLoader').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    bgImg = new Image();
                    bgImg.onload = () => render2D();
                    bgImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Click to Draw Vertices & Edges
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            points.push({ x, y });
            render2D();
            update3D();
        });

        // Render 2D View
        function render2D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Image
            if (bgImg) {
                const w = bgImg.width * zoom;
                const h = bgImg.height * zoom;
                const x = (canvas.width - w) / 2 + offsetX;
                const y = (canvas.height - h) / 2 + offsetY;
                ctx.drawImage(bgImg, x, y, w, h);
            }

            // Draw Wireframe Lines
            if (points.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.stroke();

                // Draw Vertices
                ctx.fillStyle = '#f43f5e';
                points.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, pointSize, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        // Sliders Control Listeners
        document.getElementById('sliderZoom').addEventListener('input', (e) => {
            zoom = e.target.value / 100;
            document.getElementById('valZoom').innerText = e.target.value + '%';
            render2D();
        });
        document.getElementById('sliderOffsetX').addEventListener('input', (e) => { offsetX = parseInt(e.target.value); render2D(); });
        document.getElementById('sliderOffsetY').addEventListener('input', (e) => { offsetY = parseInt(e.target.value); render2D(); });
        document.getElementById('sliderPointSize').addEventListener('input', (e) => {
            pointSize = parseInt(e.target.value);
            document.getElementById('valPointSize').innerText = pointSize + 'px';
            render2D();
        });

        // Buttons
        document.getElementById('btnUndo').addEventListener('click', () => { points.pop(); render2D(); update3D(); });
        document.getElementById('btnClearCanvas').addEventListener('click', () => { points = []; render2D(); update3D(); });
        document.getElementById('btnClearAll').addEventListener('click', () => { points = []; bgImg = null; render2D(); update3D(); });

        // Setup Basic 3D Engine (Three.js)
        const container = document.getElementById('threeContainer');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 0, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        let current3DMesh = null;

        function update3D() {
            if (current3DMesh) scene.remove(current3DMesh);
            if (points.length < 2) { renderer.render(scene, camera); return; }

            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            
            points.forEach(p => {
                // Normalize 2D points to 3D center coordinates
                vertices.push(p.x - canvas.width/2, -(p.y - canvas.height/2), 0);
            });

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.LineBasicMaterial({ color: 0x38bdf8 });
            current3DMesh = new THREE.Line(geometry, material);
            scene.add(current3DMesh);

            renderer.render(scene, camera);
        }

        // Initial setup
        setTimeout(resizeCanvas, 100);
    </script>
</body>
</html>
